<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOM // EOD Terminal</title>
  <link rel="stylesheet" href="BOOM.css">
  <script src="crono.js" defer></script>
  <script src="boom.js" defer></script>
</head>
<body>
  <div id="container" class="bomb-unit">
    <div class="hazard-bar"></div>

    <div class="unit-header">
      <span class="unit-id">EOD // MK-IV</span>
      <span class="unit-led"></span>
    </div>

    <div class="screen-housing">
      <div class="code-row">
        <div class="digit-box"><p class="asterisco" id="n1">*</p></div>
        <div class="digit-box"><p class="asterisco" id="n2">*</p></div>
        <div class="digit-box"><p class="asterisco" id="n3">*</p></div>
        <div class="digit-box"><p class="asterisco" id="n4">*</p></div>
      </div>

      <div class="chrono-box">
        <p id="display">0:0:0</p>
      </div>

      <div class="status-box">
        <p id="resultado">Pulsa Start para comenzar.</p>
      </div>
    </div>

    <div class="keypad-housing">
      <div class="num-grid">
        <button type="button" id="boton1" value="1" class="numberButton">1</button>
        <button type="button" id="boton2" value="2" class="numberButton">2</button>
        <button type="button" id="boton3" value="3" class="numberButton">3</button>

        <button type="button" id="boton4" value="4" class="numberButton">4</button>
        <button type="button" id="boton5" value="5" class="numberButton">5</button>
        <button type="button" id="boton6" value="6" class="numberButton">6</button>

        <button type="button" id="boton7" value="7" class="numberButton">7</button>
        <button type="button" id="boton8" value="8" class="numberButton">8</button>
        <button type="button" id="boton9" value="9" class="numberButton">9</button>

        <div class="blank-key"></div>
        <button type="button" id="boton0" value="0" class="numberButton">0</button>
        <div class="blank-key"></div>

        <button type="button" id="start" class="numberButton action-key">Start</button>
        <button type="button" id="stop" class="numberButton action-key">Stop</button>
        <button type="button" id="reset" class="numberButton action-key">Reset</button>
      </div>
    </div>

    <div class="hazard-bar"></div>
  </div>
</body>
</html>
